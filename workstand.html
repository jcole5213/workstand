<title>Workstand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column mobile workshop log. Up-next queue on top, bike switcher, then the selected bike's component cards and its history. Wear shown as chain-link meters. */
:root{
  --bg:#0E1013; --surface:#16191E; --surface-2:#1D2127; --ink:#E9ECF0; --ink-2:#A0A8B3; --ink-3:#6E7682;
  --line:#2A2F37; --track:#262B32; --accent:#8099FF; --accent-ink:#0E1013;
  --ok:#4CC283; --soon:#E7AE3C; --due:#FF6B5A; --ok-bg:#15291F; --soon-bg:#2E2513; --due-bg:#33191A;
  --bike-lime:#B5D84A; --bike-obsidian:#BFC5CF; --bike-sage:#A3BE9E; --bike-petrol:#5FAAC4; --bike-gold:#E2B656; --bike-onyx:#8DA1E6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
  color-scheme:dark}
/* Workstand is dark by design in every theme: a garage at night. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.brand svg{width:30px;height:30px;color:var(--accent)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--ok)} .dot.busy{background:var(--soon);animation:pulse 1s infinite} .dot.err{background:var(--due)}
@keyframes pulse{50%{opacity:.3}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--due);border-color:var(--due)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* up next */
.queue{display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qhead h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.qitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;overflow:hidden}
.qitem .sev{align-self:stretch;border-radius:0 3px 3px 0}
.qitem.due .sev{background:var(--due)} .qitem.soon .sev{background:var(--soon)} .qitem.tip .sev{background:var(--accent)} .qitem.setup .sev{background:var(--ink-3)} .qitem.todo .sev{background:var(--ink)}
.qitem .t{font-weight:600;min-width:0}
.qitem .s{font-size:13px;color:var(--ink-2)}
.qitem .bk{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2);font-size:14px}

/* bike switcher */
.bikes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.bike{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.bike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bike.on{border-color:var(--bc);box-shadow:0 0 0 1px var(--bc) inset}
.bike .swatch{position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--bc);opacity:.9}
/* Bike art: a dark service bay in both themes, the art lit from behind in the bike's own color */
.bike.art{--ink:#F2F4F6;--ink-2:#B8BFC8;--ink-3:#8D959F;--track:rgba(255,255,255,.16);--surface:#0A0B0D;--surface-2:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
  --ok:#5FD394;--soon:#F0B84A;--due:#FF7362;--ok-bg:rgba(95,211,148,.16);--soon-bg:rgba(240,184,74,.16);--due-bg:rgba(255,115,98,.18);
  --bike-lime:#B5D84A;--bike-obsidian:#C9CED6;color:var(--ink);background:#050607;min-height:236px;border-color:rgba(255,255,255,.1);isolation:isolate}
.bike.art .swatch{display:none}
.bike .bay{position:absolute;inset:0;z-index:-1;pointer-events:none}
.bike .bay::before{content:"";position:absolute;right:4%;top:18%;width:62%;height:70%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--bc) 38%,transparent),transparent);filter:blur(8px);opacity:.55;transition:opacity .4s}
.bike .bay img{position:absolute;right:-6%;top:50%;width:84%;max-width:none;transform:translateY(-46%);filter:saturate(.85) brightness(.82);transition:filter .4s,transform .4s;
  -webkit-mask-image:radial-gradient(ellipse 72% 70% at 55% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 55% 52%,#000 62%,transparent 100%)}
.bike .bay::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,7,.94) 0%,rgba(5,6,7,.72) 38%,rgba(5,6,7,.28) 72%,rgba(5,6,7,.12) 100%),linear-gradient(0deg,rgba(5,6,7,.85) 0%,transparent 42%);transition:opacity .4s}
.bike.art:not(.on) .bay img{filter:saturate(.35) brightness(.5)}
.bike.art:not(.on) .bay::before{opacity:.15}
.bike.art:hover .bay img{filter:saturate(.9) brightness(.85)}
.bike.art.on .bay img{transform:translateY(-46%) scale(1.03)}
.bike.art .nm{font-size:30px;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.bike.art .bars{opacity:.9}
/* The stand: the bike's art with live status pins on each part */
.stand{position:relative;border-radius:var(--r);overflow:hidden;background:#050607;isolation:isolate}
.stand::before{content:"";position:absolute;left:18%;right:18%;top:14%;bottom:14%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--bc) 30%,transparent),transparent);filter:blur(10px);z-index:-1}
.stand .frame{position:relative;width:min(100%,780px);margin:0 auto;aspect-ratio:var(--ar)}
.stand img{display:block;width:100%;height:100%;-webkit-mask-image:radial-gradient(ellipse 70% 72% at 50% 52%,#000 66%,transparent 100%);mask-image:radial-gradient(ellipse 70% 72% at 50% 52%,#000 66%,transparent 100%)}
.stand .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(0deg,rgba(5,6,7,.9),transparent);pointer-events:none}
.stand .legend{position:absolute;left:14px;bottom:10px;display:flex;gap:12px;font-size:11px;color:#A9B0B9;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
.stand .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.hs{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:6px;display:flex;align-items:center;gap:6px;color:#F2F4F6;z-index:2}
.hs .d{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(5,6,7,.75),0 0 14px var(--c);flex:none;position:relative}
.hs.due .d::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.hs .t{font-size:11px;font-weight:600;letter-spacing:.04em;background:rgba(5,6,7,.82);border:1px solid rgba(255,255,255,.14);padding:2px 7px;border-radius:999px;white-space:nowrap}
.hs.ok .t{display:none}
.hs.ok:hover .t,.hs.ok:focus-visible .t{display:inline}
.hs.flip{flex-direction:row-reverse}
.hs.flip{transform:translate(calc(-100% + 13px),-50%)}
.hs:not(.flip){transform:translate(-13px,-50%)}
.hs{--c:#5FD394}.hs.soon{--c:#F0B84A}.hs.due{--c:#FF7362}
.card.flash{animation:flash 1.2s ease-out}
.standcta{position:absolute;right:12px;top:12px;z-index:3}
/* Setup scratchboard: the numbers you set at the stand, plus free notes */
.setup .vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.setup .val{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.setup .val .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.setup .val .n{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.setup .val .n small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2);margin-left:4px}
.setup .val.empty .n{color:var(--ink-3)}
.setup textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:96px;resize:vertical;line-height:1.5}
.setup textarea:focus{border-style:solid}
.setup .meta{font-size:12px;color:var(--ink-3)}
.psi{position:absolute;transform:translate(-50%,0);font-family:var(--f-mono);font-size:11px;font-weight:600;color:#E9ECF0;background:rgba(5,6,7,.78);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:1px 6px;white-space:nowrap;pointer-events:none;z-index:1}
.setuprow{display:grid;grid-template-columns:1fr 90px 70px auto;gap:6px;align-items:center}
.setuprow input{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%;min-width:0}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--bc)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:520px){.hs .t{font-size:10px;padding:1px 6px}.bike .bay img{width:96%;right:-18%}}
.bike .nm{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1;padding-right:56px}
.bike .fin{font-size:12px;color:var(--ink-2);text-transform:lowercase}
.odo{display:flex;gap:18px;flex-wrap:wrap}
.odo .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.odo .l{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.bars{display:block;width:100%;height:38px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;letter-spacing:.02em}
.pill.due{background:var(--due-bg);color:var(--due)} .pill.soon{background:var(--soon-bg);color:var(--soon)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.est{background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--line)}

/* detail */
.detail{display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:40px;font-weight:700;line-height:.95;color:var(--ink)}
.dhead h2 span{color:var(--bc)}
.dhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .ck{font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.card .cl{font-size:12px;color:var(--ink-2)}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big .v{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big .u{font-size:13px;color:var(--ink-2)}
.rows{display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .k{color:var(--ink-2)} .row .num{font-size:12.5px}
.card.missing{border-style:dashed;background:transparent;justify-content:center;align-items:flex-start}
.iconbtn{border:0;background:transparent;color:var(--ink-3);padding:4px;border-radius:8px;line-height:0}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}

/* chain-link meter */
.links{display:flex;gap:2px;align-items:center}
.lk{flex:1;height:14px;border-radius:7px;background:var(--track);position:relative;min-width:0}
.lk::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--surface);left:50%;top:50%;transform:translate(-50%,-50%)}
.lk.ok{background:var(--ok)} .lk.soon{background:var(--soon)} .lk.due{background:var(--due)}
.lk.part{background:linear-gradient(90deg,var(--c) var(--p),var(--track) var(--p))}
.uses{display:flex;gap:6px}
.use{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.use.on{background:var(--c,var(--ok));border-color:var(--c,var(--ok))}

/* history */
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:84px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.hrow:first-child{border-top:0}
.hrow .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.hrow .n{min-width:0}
.hrow .n small{display:block;color:var(--ink-2);font-size:12px}

/* log fab + sheet */
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.06em;padding:14px 22px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.acts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.act b{font-size:14px} .act span{font-size:12px;color:var(--ink-2)}
.act:hover{border-color:var(--accent)}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
legend{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;padding:0 6px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40}
.foot-note{font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
/* Pixel art always renders crisp */
.bike .bay img,.stand img,.pinframe img,.wz-art img,.artprev img,.artprev canvas{image-rendering:pixelated}
.toprt{display:flex;align-items:center;gap:6px}
/* Onboarding */
.wz{display:flex;flex-direction:column;gap:18px;max-width:640px;margin:0 auto;width:100%}
.wz .steps{display:flex;gap:6px}
.wz .steps i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.wz .steps i.on{background:var(--accent)}
.wz h2{font-size:42px;font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.wz .lead{color:var(--ink-2);font-size:15px;margin:0}
.wz .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.wz .panel > b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:14px}
.how b{color:var(--ink)}
.wz .nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.pick:has(input:checked){border-color:var(--accent)}
.pick input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.pick .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pick .s{font-size:12px;color:var(--ink-2)}
.pick select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.err{color:var(--due);font-size:14px;margin:0}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.choice:has(input:checked){border-color:var(--accent);background:var(--surface-2)}
.choice input{margin-top:3px;accent-color:var(--accent)}
.choice small{display:block;color:var(--ink-2);font-size:12.5px}
.wz-art{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#050607}
.wz-art img{width:132px;aspect-ratio:var(--ar);object-fit:contain;display:block}
.wz-art .nm{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.wz-art .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:420px){.wz-art{grid-template-columns:96px 1fr}.wz-art img{width:96px}}
/* Art editor */
.artprev{border-radius:12px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:150px;background-color:#050607;background-image:linear-gradient(45deg,#0d1013 25%,transparent 25%,transparent 75%,#0d1013 75%),linear-gradient(45deg,#0d1013 25%,transparent 25%,transparent 75%,#0d1013 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.artprev img,.artprev canvas{max-width:100%;max-height:240px;width:auto;height:auto}

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="2" y="10" width="16" height="12" rx="6"/><rect x="14" y="10" width="16" height="12" rx="6"/><circle cx="8" cy="16" r="1.6" fill="currentColor"/><circle cx="24" cy="16" r="1.6" fill="currentColor"/></svg>
      <h1>Workstand</h1>
    </div>

  </section>

<button class="fab" id="fab" hidden data-a="log"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log</button>
<div id="sheetHost"></div>

<script>
(() => {
const M_PER_MI = 1609.344, M_PER_FT = 0.3048;
const S = { db:null, root:null, uid:null, mcp:null, assets:null, garage:null, gear:null, wiz:null, bikes:{}, rides:{}, comps:[], events:[], todos:[], sel:null, loaded:{garage:false,bikes:false,rides:false,components:false,events:false,todos:false},
  sync:{state:'idle', msg:'', at:null}, confirmDel:null };

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const nowISO = () => localISO(new Date());
const today = () => nowISO().slice(0,10);
const parseL = s => new Date(s.length <= 10 ? s + 'T00:00:00' : s);
const daysSince = s => Math.max(0, (Date.now() - parseL(s).getTime()) / 864e5);
const addDays = (s, n) => { const d = parseL(s); d.setDate(d.getDate()+n); return localISO(d); };
const fmtMi = n => n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(1);
const fmtH = sec => { const h = sec/3600; return h >= 100 ? Math.round(h).toLocaleString() : h.toFixed(1); };
const fmtDate = s => { if (!s) return '—'; const d = parseL(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric', year: d.getFullYear()!==new Date().getFullYear() ? '2-digit' : undefined}); };
const relDays = n => n < 1 ? 'today' : n < 1.5 ? 'tomorrow' : n < 14 ? `in ~${Math.round(n)} days` : n < 60 ? `in ~${Math.round(n/7)} weeks` : `in ~${Math.round(n/30)} months`;
function toast(t){ const el = document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2200); }
function atFromDate(dateStr, kind){ // installs count that day's rides; services happen after that day's ride
  if (!dateStr) return null;
  if (dateStr === today()) return nowISO();
  return dateStr + (kind === 'install' ? 'T00:00:00' : 'T23:59:00');
}

/* ---------- bike defaults ---------- */
function terrain(b){ const f=String(b.type||b.frameType||'').toLowerCase(); return f==='mtb' ? 'mtb' : (f==='gravel'||f==='cross') ? 'gravel' : 'road'; }
/* Everything wears by ride hours (Strava moving time). Sealant is the exception: it dries on the calendar. */
const BASE = {
  road:  {wax:16, drip:8, oil:10, chainLife:230, wearCheck:45, tireFront:230, tireRear:145, pads:115},
  gravel:{wax:15, drip:7, oil:9,  chainLife:170, wearCheck:35, tireFront:170, tireRear:115, pads:85},
  mtb:   {wax:12, drip:6, oil:7,  chainLife:150, wearCheck:30, tireFront:115, tireRear:75,  pads:40}
};
function cfg(b){
  const t = terrain(b), base = BASE[t], s = b.settings || {}, G = (S.garage && S.garage.defaults) || {};
  const lube = s.lube || G.lube || 'immersion';
  const rewaxDefault = (+G.rewaxHrs && lube===(G.lube||'immersion')) ? +G.rewaxHrs : lube==='immersion' ? base.wax : lube==='drip' ? base.drip : base.oil;
  return { terrain:t, lube,
    rewaxHrs: +s.rewaxHrs || rewaxDefault, chainLifeHrs: +s.chainLifeHrs || base.chainLife, wearCheckHrs: base.wearCheck,
    tireFrontHrs: +s.tireFrontHrs || base.tireFront, tireRearHrs: +s.tireRearHrs || base.tireRear,
    qlMax: +s.qlMax || +G.qlMax || 3, sealantDays: +s.sealantDays || +G.sealantDays || 90, sealantRefreshDays: 180,
    padsHrs: +s.padsHrs || base.pads, forkHrs: +s.forkHrs || 50, shockHrs: +s.shockHrs || 50 };
}
const LUBE = {immersion:'Immersion wax', drip:'Drip wax', oil:'Wet/dry lube'};

/* ---------- ride math ---------- */
const ridesOf = id => (S.rides[id] || []);
function usage(id, from, to){ let mi=0, sec=0, n=0; for (const r of ridesOf(id)) { if (from && r[1] < from) continue; if (to && r[1] >= to) continue; mi+=r[2]; sec+=r[3]; n++; } return {mi, sec, n}; }
function pace(id){ // per day over last 28 days, fallback to all-time
  const from = addDays(today(), -28); const u = usage(id, from);
  if (u.n) return {mi:u.mi/28, sec:u.sec/28};
  const rs = ridesOf(id); if (!rs.length) return {mi:0, sec:0};
  const span = Math.max(7, daysSince(rs.reduce((a,r)=> r[1]<a ? r[1] : a, rs[0][1])));
  const all = usage(id); return {mi: all.mi/span, sec: all.sec/span};
}
function typicalRide(id){ const rs = ridesOf(id).filter(r=>r[1] >= addDays(today(),-56)).map(r=>r[3]/3600).sort((a,b)=>a-b); return rs.length ? rs[Math.floor(rs.length/2)] : 0; }
const NOTE_RX = /\b(wax(ed)?|re-?wax|lube[ds]?|sealant|stan'?s|orange seal|new tires?|tyres?|pads?|quick ?link|missing link|chain|bleed|fork|shock|serviced?|cleats?|bar tape|cassette)\b/i;
function noteKind(t){ t = t.toLowerCase(); if (/wax/.test(t)) return 'rewax'; if (/lube/.test(t)) return 'lube'; if (/sealant|stan|orange seal/.test(t)) return 'sealant'; if (/quick ?link|missing link/.test(t)) return 'qluse'; if (/tire|tyre/.test(t)) return 'newtire'; if (/pad|fork|shock|bleed|service|cassette/.test(t)) return 'service'; if (/chain/.test(t)) return 'newchain'; return 'note'; }
function weekly(id, weeks=12){
  const out = []; const t = parseL(today()); t.setDate(t.getDate()+1);
  for (let i=weeks; i>0; i--) { const a = new Date(t); a.setDate(a.getDate()-i*7); const b = new Date(t); b.setDate(b.getDate()-(i-1)*7); out.push(usage(id, localISO(a), localISO(b)).sec/3600); }
  return out;
}

/* ---------- components & metrics ---------- */
const KIND = {chain:'Chain', quicklink:'Quick link', tire:'Tire', pads:'Brake pads', fork:'Fork', shock:'Shock', cassette:'Cassette', custom:'Component'};
const activeComps = id => S.comps.filter(c => c.bikeId===id && !c.retiredAt);
const compOf = (id, kind, pos) => activeComps(id).find(c => c.kind===kind && (!pos || c.pos===pos));
const evFor = (cid, types) => S.events.filter(e => e.componentId===cid && types.includes(e.type)).sort((a,b)=> a.at<b.at?1:-1);
function status(p){ return p >= 1 ? 'due' : p >= .8 ? 'soon' : 'ok'; }
function metricsFor(c, b){
  const k = cfg(b), id = b.id, out = [];
  const since = from => usage(id, from);
  const pc = pace(id);
  const mk = (o) => { o.pct = o.lim ? o.val/o.lim : 0; o.st = status(o.pct);
    if (o.unit==='mi' && pc.mi>0) o.eta = (o.lim-o.val)/pc.mi;
    else if (o.unit==='h' && pc.sec>0) o.eta = (o.lim-o.val)*3600/pc.sec;
    else if (o.unit==='days') o.eta = o.lim-o.val;
    out.push(o); return o; };
  const H = u => u.sec/3600;
  if (c.kind==='chain'){
    const last = evFor(c.id, ['rewax','lube'])[0];
    const base = last ? last.at : (c.waxedAtInstall !== false ? c.installedAt : null);
    if (base){ const u = since(base);
      mk({key:'wax', label: k.lube==='oil' ? 'Since lube' : 'Since wax', primary:true, val: H(u) + (last ? 0 : (+c.priorWaxHrs||0)), lim: k.rewaxHrs, unit:'h',
        sub:`${fmtMi(u.mi)} mi · ${u.n} ride${u.n===1?'':'s'} since ${fmtDate(base)}`, action: k.lube==='oil' ? 'lube' : 'rewax',
        title: k.lube==='oil' ? 'Clean and lube the chain' : 'Rewax the chain'});
    }
    const life = since(c.installedAt); const total = (+c.priorHrs||0) + H(life);
    mk({key:'life', label:'Chain hours', val: total, lim:k.chainLifeHrs, unit:'h', sub:`${fmtMi(life.mi)} mi on this chain`, quiet:true, title:'Chain is near typical end of life', action:'newchain'});
    const wc = evFor(c.id, ['wear'])[0];
    const wcBase = wc ? wc.at : c.installedAt; const wu = since(wcBase);
    const m = mk({key:'wear', label:'Wear check', val: H(wu) + (wc ? 0 : (+c.priorHrs||0)), lim: wc ? k.wearCheckHrs : Math.round(k.chainLifeHrs*0.4), unit:'h', quiet:true, title:'Check chain stretch', action:'wear',
      sub: wc ? `Last reading ${wc.meta?.wear ?? '?'}% on ${fmtDate(wc.at)}` : 'No reading yet'});
    if (wc && +wc.meta?.wear >= .5){ m.st = 'due'; m.pct = Math.max(m.pct, 1); m.title = +wc.meta.wear >= .75 ? 'Replace chain and check the cassette' : 'Replace the chain'; m.action='newchain'; m.wearFlag = +wc.meta.wear; }
  }
  if (c.kind==='quicklink'){
    const uses = (+c.priorUses||0) + S.events.filter(e => (e.type==='qluse' && e.componentId===c.id) || (e.type==='rewax' && e.meta?.qlId===c.id)).length;
    mk({key:'uses', label:'Uses', primary:true, val:uses, lim:k.qlMax, unit:'uses', title: uses >= k.qlMax ? 'Fit a new quick link' : 'Quick link nearly used up', action:'newql', sub:`Installed ${fmtDate(c.installedAt)}`});
  }
  if (c.kind==='tire'){
    const u = since(c.installedAt); const lim = c.pos==='front' ? k.tireFrontHrs : k.tireRearHrs;
    mk({key:'tread', label:'Tire hours', primary:true, val:(+c.priorHrs||0)+H(u), lim, unit:'h', title:`${c.pos==='front'?'Front':'Rear'} tire is wearing out`, action:'newtire',
      sub:`${fmtMi(u.mi)} mi since ${fmtDate(c.installedAt)}`});
    const sl = evFor(c.id, ['sealant_add','sealant_change'])[0];
    const sBase = sl ? sl.at : (c.sealantAtInstall !== false ? c.installedAt : null);
    const summer = [4,5,6,7,8].includes(new Date().getMonth());
    const sd = summer ? Math.round(k.sealantDays*0.75) : k.sealantDays;
    if (sBase) mk({key:'sealant', label:'Sealant', val: daysSince(sBase), lim: sd, unit:'days', title:`Top up ${c.pos} sealant`, action:'sealant',
      sub: `Last ${sl ? (sl.type==='sealant_change'?'fresh fill':'top-up') : 'fill at install'} ${fmtDate(sBase)}${summer?' · summer heat dries it faster':''}`});
    const fresh = evFor(c.id, ['sealant_change'])[0];
    const fBase = fresh ? fresh.at : (c.sealantAtInstall !== false ? c.installedAt : null);
    if (fBase) mk({key:'refresh', label:'Fresh sealant', val: daysSince(fBase), lim:k.sealantRefreshDays, unit:'days', quiet:true, title:`Clean out and refill ${c.pos} sealant`, action:'sealant_change', sub:`Clean-out ${fmtDate(fBase)}`});
  }
  if (['pads','fork','shock','cassette','custom'].includes(c.kind)){
    const last = evFor(c.id, ['service'])[0]; const base = last ? last.at : c.installedAt; const u = since(base);
    let limMi = +c.intervalMi || 0, limH = +c.intervalHrs || 0;
    if (!limMi && !limH){ if (c.kind==='pads') limH=k.padsHrs; if (c.kind==='fork') limH=k.forkHrs; if (c.kind==='shock') limH=k.shockHrs; if (c.kind==='cassette') limH = k.chainLifeHrs*3; if (c.kind==='custom') limH = 100; }
    const byH = limH && (!limMi || (u.sec/3600)/limH > u.mi/limMi);
    const nm = c.kind==='custom' ? (c.label||'Component') : KIND[c.kind];
    if (limMi || limH) mk({key:'svc', label: c.kind==='pads' ? 'On these pads' : 'Since service', primary:true, val: byH ? u.sec/3600 : u.mi, lim: byH ? limH : limMi, unit: byH ? 'h':'mi',
      title: c.kind==='pads' ? 'Check brake pad thickness' : c.kind==='fork' ? 'Fork lower-leg service' : c.kind==='shock' ? 'Shock air-can service' : `Service: ${nm}`, action:'service',
      sub:`${fmtMi(u.mi)} mi · ${fmtH(u.sec)} h since ${fmtDate(base)}`});
  }
  return out;
}

/* ---------- suggestions ---------- */
function suggestions(){
  const items = [];
  for (const b of bikeList()){
    const k = cfg(b), comps = activeComps(b.id), typ = typicalRide(b.id);
    const chain = compOf(b.id,'chain'), ql = compOf(b.id,'quicklink');
    const tf = compOf(b.id,'tire','front'), tr = compOf(b.id,'tire','rear');
    if (!chain || !tf || !tr) items.push({sev:'setup', score:0.5, b, title:`Set up ${b.short}`, sub:`Add ${[!chain&&'the chain',!tf&&'front tire',!tr&&'rear tire'].filter(Boolean).join(', ')} so wax miles, tread and sealant start counting.`, act:'setup'});
    for (const td of S.todos.filter(t=>t.bikeId===b.id)) items.push({sev:'todo', score:3, b, title:td.title, sub:[td.label && `Fit: ${td.label}`, td.notes].filter(Boolean).join(' · ') || 'Planned job', act:td.act||'note', todoId:td.id, pos:td.pos||'', label:td.label||''});
    const due = [];
    for (const c of comps){
      for (const m of metricsFor(c, b)){
        if (m.st==='ok') continue;
        let sub = `${fmtV(m)} of ${fmtL(m)}`;
        if (m.st==='due') sub += ' · overdue';
        else if (m.eta!=null) sub += ` · due ${relDays(m.eta)} at your pace`;
        if (m.key==='wax' && typ && m.lim - m.val < typ && m.st!=='due') sub = `${(m.lim-m.val).toFixed(1)} h left, less than your typical ${typ.toFixed(1)} h ride. Wax before the next one.`;
        if (m.wearFlag) sub = `Last reading ${m.wearFlag}%. ${m.wearFlag>=.75 ? 'Past .75% the cassette usually needs replacing too.' : 'Replacing at .5% protects the cassette and rings.'}`;
        const it = {sev:m.st, score: m.pct + (m.st==='due'?1:0) - (m.quiet?0.1:0), b, title:m.title, sub, act:m.action, cid:c.id, eta:m.eta};
        items.push(it); due.push(it);
      }
    }
    // quick link meets rewax
    if (ql && chain){
      const qm = metricsFor(ql,b)[0], wm = metricsFor(chain,b).find(m=>m.key==='wax');
      if (qm && wm && k.lube==='immersion' && qm.val === k.qlMax-1 && wm.pct >= .6)
        items.push({sev:'tip', score:.7, b, title:'Next rewax uses your last quick-link use', sub:`${qm.val} of ${k.qlMax} used. Have a spare ready before the chain comes off.`, act:'newql'});
    }
    // tire rotation tip for road/gravel
    if (tf && tr && k.terrain!=='mtb'){
      const fm = metricsFor(tf,b)[0], rm = metricsFor(tr,b)[0];
      if (rm.pct >= .75 && fm.pct <= .55) items.push({sev:'tip', score:.65, b, title:'Plan a front-to-rear rotation', sub:`Rear is at ${Math.round(rm.pct*100)}%, front at ${Math.round(fm.pct*100)}%. When the rear is done, move the front back and put the new tire up front.`, act:'rotate'});
    }
    // ride notes that mention maintenance, since tracking started
    const start = activeComps(b.id).concat(S.comps.filter(c=>c.bikeId===b.id)).reduce((a,c)=> !a || c.installedAt < a ? c.installedAt : a, '');
    const dismissed = new Set(b.dismissedNotes || []);
    if (start) for (const r of ridesOf(b.id)) {
      if (!r[6] || r[1] < start || dismissed.has(r[0])) continue;
      const snip = r[6].length > 110 ? r[6].slice(0,107) + '…' : r[6];
      items.push({sev:'tip', score:.75, b, title:`Your ${fmtDate(r[1])} ride notes mention ${(r[6].match(NOTE_RX)||['service'])[0].toLowerCase()}`, sub:`“${snip}” Log it?`, act:noteKind(r[6]), rideId:r[0]});
    }
    // bundle
    const soonish = due.filter(i => i.eta==null || i.eta <= 10);
    if (soonish.length >= 2) items.push({sev:'tip', score:.6, b, title:`Batch ${soonish.length} jobs on the ${b.short}`, sub: soonish.slice(0,3).map(i=>i.title.toLowerCase()).join(', ') + '. One stand session covers them.', act:'log'});
  }
  return items.sort((a,b)=> b.score-a.score);
}
function fmtV(m){ return m.unit==='mi' ? `${fmtMi(m.val)} mi` : m.unit==='h' ? `${m.val.toFixed(1)} h` : m.unit==='days' ? `${Math.floor(m.val)} days` : `${m.val} ${m.val===1?'use':'uses'}`; }
function fmtL(m){ return m.unit==='mi' ? `${fmtMi(m.lim)} mi` : m.unit==='h' ? `${m.lim} h` : m.unit==='days' ? `${m.lim} days` : `${m.lim}`; }

/* ---------- bikes ---------- */
function splitName(n){ const m = String(n||'').match(/^(.*?)\s*\((.*)\)\s*$/); const raw = m ? m[1] : n; const fin = m ? m[2].replace(/\p{Extended_Pictographic}|‍|️/gu,'').trim() : ''; return {short: String(raw).replace(/^_/, '').trim(), finish: fin}; }
function bikeList(){ return Object.values(S.bikes).filter(b => !b.retired && !b.hidden).map(b => ({...b, ...splitName(b.name)})).sort((a,b)=> lastRide(b.id) > lastRide(a.id) ? 1 : -1); }
const lastRide = id => ridesOf(id).reduce((a,r)=> r[1]>a ? r[1] : a, '');
const firstRide = id => ridesOf(id).reduce((a,r)=> !a || r[1]<a ? r[1] : a, '');
const bikeColor = b => `var(--bike-${b.color || 'onyx'})`;
const fullBike = id => bikeList().find(x=>x.id===id) || (S.bikes[id] ? {...S.bikes[id], ...splitName(S.bikes[id].name)} : null);
function bikeWorst(b){ let w='ok'; for (const c of activeComps(b.id)) for (const m of metricsFor(c,b)) { if (m.st==='due') return 'due'; if (m.st==='soon') w='soon'; } return w; }

/* ---------- render ---------- */
function render(){
  if (allLoaded() && S.root && !(S.garage && S.garage.onboarded) && !S.wiz) S.wiz = newWiz();
  const inWiz = !!S.wiz;
  $('#wizard').hidden = !inWiz;
  for (const sel of ['#queue','#bikes','#detail','.foot-note']) $(sel).hidden = inWiz;
  if (inWiz){ renderSync(); $('#fab').hidden = true; renderWizard(); return; }
  renderSync();
  const list = bikeList();
  if (!S.sel || !list.find(b=>b.id===S.sel)) S.sel = list[0]?.id || null;
  $('#fab').hidden = !S.sel;
  // queue
  const q = $('#queue');
  if (!list.length){ q.innerHTML = `<div class="qhead"><h2>Up next</h2></div><div class="empty">${allLoaded() ? 'No active bikes yet. Tap “Sync Strava” to pull your non-retired bikes.' : 'Loading your garage…'}</div>`; }
  else {
    const sg = suggestions().slice(0,8);
    q.innerHTML = `<div class="qhead"><h2>Up next</h2><span class="eyebrow">${sg.filter(s=>s.sev==='todo').length} planned · ${sg.filter(s=>s.sev==='due').length} due · ${sg.filter(s=>s.sev==='soon').length} soon</span></div>` +
      (sg.length ? sg.map(s => `<div class="qitem ${s.sev}"><div class="sev"></div><div style="min-width:0"><div class="bk" style="color:${bikeColor(s.b)}">${esc(s.b.short)}</div><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub)}</div></div>

const EVLABEL = {rewax:'Rewaxed chain', lube:'Cleaned and lubed chain', qluse:'Quick link opened', sealant_add:'Sealant top-up', sealant_change:'Fresh sealant', rotate:'Rotated tires', wear:'Chain wear check', service:'Serviced', note:'Note'};
function historyFor(id){
  const out = [];

    const c = S.comps.find(x=>x.id===e.componentId);

    if (e.type==='service' && c) t = `Serviced ${c.kind==='custom'?c.label:KIND[c.kind].toLowerCase()}`;

    if (!tf && !tr) return needs('tires');
    const pre = cid ? (S.comps.find(c=>c.id===cid)?.pos || 'both') : 'both';
    return openSheet(`${hdr(kind==='sealant'?'Sealant top-up':'Fresh sealant')}<form><div class="seg">${['front','rear','both'].map(p=>`<label><input type="radio" name="f_pos" value="${p}" ${p===pre?'checked':''}><span>${p[0].toUpperCase()+p.slice(1)}</span></label>`).join('')}</div>
      <div class="fgrid">${dateField('f_date','Date',today())}<label class="field" for="f_ml">Amount (ml)<input id="f_ml" name="f_ml" type="number" min="0" step="5" placeholder="${kind==='sealant'?'30':'60'}"></label></div>${notes}${foot()}</form>`,
      async fd => { const pos = fd.get('f_pos'); const at = atFromDate(fd.get('f_date'),'service');
        for (const t of [pos!=='rear'&&tf, pos!=='front'&&tr].filter(Boolean)) await addEvent({bikeId:bid, componentId:t.id, type: kind==='sealant'?'sealant_add':'sealant_change', at, notes:fd.get('f_notes')||'', meta: fd.get('f_ml') ? {ml:+fd.get('f_ml')} : {}});
        toast('Sealant logged'); });
  }
  if (kind==='newtire'){
    const pre = opt.pos || (cid ? (S.comps.find(c=>c.id===cid)?.pos || 'rear') : 'rear');
    return openSheet(`${hdr('New tire')}<form><div class="seg">${['front','rear','both'].map(p=>`<label><input type="radio" name="f_pos" value="${p}" ${p===pre?'checked':''}><span>${p[0].toUpperCase()+p.slice(1)}</span></label>`).join('')}</div>
      <div class="fgrid">${dateField('f_date','Installed',today())}<label class="field" for="f_label">Tire<input id="f_label" name="f_label" placeholder="Model and width" value="${esc(opt.label||'')}"></label><label class="field" for="f_mm">Measured width mounted (mm)<input id="f_mm" name="f_mm" type="number" min="10" max="120" step="0.1" inputmode="decimal" placeholder="optional"></label></div>
      <label class="check"><input type="checkbox" id="f_seal" name="f_seal" checked> Set up tubeless with fresh sealant</label>${foot()}</form>`,
      async fd => { const sel = fd.get('f_pos'); const at = atFromDate(fd.get('f_date'),'install');
        for (const pos of sel==='both' ? ['front','rear'] : [sel]) { const old = compOf(bid,'tire',pos); if (old) await retire(old, at);
          await addComp({bikeId:bid, kind:'tire', pos, label:fd.get('f_label')||'', measuredMm: fd.get('f_mm') ? +fd.get('f_mm') : null, installedAt:at, sealantAtInstall: !!fd.get('f_seal')}); }
        toast(sel==='both' ? 'New tires logged' : `New ${sel} tire logged`); });
  }
  if (kind==='rotate'){
    if (!tf || !tr) return needs('front and rear tires');
    return openSheet(`${hdr('Rotate tires')}<p class="muted">Swaps the tracked front and rear tires. Each tire keeps its own miles.</p><form>${dateField('f_date','Date',today())}${notes}${foot('Swap them')}</form>`,
      async fd => { const at = atFromDate(fd.get('f_date'),'service'); await dref('components',tf.id).update({pos:'rear'}); await dref('components',tr.id).update({pos:'front'}); await addEvent({bikeId:bid, type:'rotate', at, notes:fd.get('f_notes')||''}); toast('Tires rotated'); });
  }
  if (kind==='wear'){
    if (!chain) return needs('chain');
    return openSheet(`${hdr('Chain wear check')}<form><div class="fgrid">${dateField('f_date','Date',today())}<label class="field" for="f_wear">Stretch (%)<select id="f_wear" name="f_wear"><option>0</option><option>0.25</option><option selected>0.3</option><option>0.4</option><option>0.5</option><option>0.6</option><option>0.75</option><option>1</option></select></label></div><p class="muted" style="font-size:13px;margin:0">Most 11 and 12 speed chains are due at 0.5%.</p>${notes}${foot()}</form>`,
      async fd => { await addEvent({bikeId:bid, componentId:chain.id, type:'wear', at:atFromDate(fd.get('f_date'),'service'), meta:{wear:+fd.get('f_wear')}, notes:fd.get('f_notes')||''}); toast('Wear reading saved'); });
  }
  if (kind==='newchain'){
    return openSheet(`${hdr('New chain')}<form><div class="fgrid">${dateField('f_date','Installed',today())}<label class="field" for="f_label">Chain<input id="f_label" name="f_label" placeholder="e.g. 12-speed, pre-waxed"></label></div>
      <label class="check"><input type="checkbox" id="f_waxed" name="f_waxed" ${k.lube==='oil'?'':'checked'}> Waxed before install</label><label class="check"><input type="checkbox" id="f_newql" name="f_newql" checked> Fitted a new quick link</label>${foot()}</form>`,
      async fd => { const at = atFromDate(fd.get('f_date'),'install'); if (chain) await retire(chain, at);
        await addComp({bikeId:bid, kind:'chain', label:fd.get('f_label')||'', installedAt:at, waxedAtInstall: !!fd.get('f_waxed'), priorHrs:0});
        if (fd.get('f_newql')){ if (ql) await retire(ql, at); await addComp({bikeId:bid, kind:'quicklink', installedAt:at, priorUses:1}); }
        toast('New chain logged'); });
  }
  if (kind==='newql'){
    return openSheet(`${hdr('New quick link')}<form>${dateField('f_date','Installed',today())}<label class="check"><input type="checkbox" id="f_first" name="f_first" checked> Counts as its first use</label>${foot()}</form>`,
      async fd => { const at = atFromDate(fd.get('f_date'),'install'); if (ql) await retire(ql, at); await addComp({bikeId:bid, kind:'quicklink', installedAt:at, priorUses: fd.get('f_first')?1:0}); toast('New quick link logged'); });
  }
  if (kind==='service'){
    const svc = activeComps(bid).filter(c=>['pads','fork','shock','cassette','custom'].includes(c.kind));
    if (!svc.length) return addCompSheet(bid);
    return openSheet(`${hdr('Service')}<form><label class="field" for="f_cid">Component<select id="f_cid" name="f_cid">${svc.map(c=>`<option value="${esc(c.id)}" ${c.id===cid?'selected':''}>${esc(c.kind==='custom'?c.label:KIND[c.kind])}</option>`).join('')}</select></label>${dateField('f_date','Date',today())}
      <label class="check"><input type="checkbox" id="f_replace" name="f_replace"> Replaced it (new part)</label>${notes}${foot()}</form>`,
      async fd => { const c = S.comps.find(x=>x.id===fd.get('f_cid')); const at = atFromDate(fd.get('f_date'), fd.get('f_replace')?'install':'service');
        if (fd.get('f_replace')){ await retire(c, at); const {id, createdAt, retiredAt, estimated, ...rest} = c; await addComp({...rest, installedAt:at}); }
        else await addEvent({bikeId:bid, componentId:c.id, type:'service', at, notes:fd.get('f_notes')||''}); toast('Service logged'); });
  }
  if (kind==='note'){
    return openSheet(`${hdr('Note')}<form>${dateField('f_date','Date',today())}<label class="field" for="f_notes">Note<textarea id="f_notes" name="f_notes" rows="3" required></textarea></label>${foot()}</form>`,
      async fd => { await addEvent({bikeId:bid, type:'note', at:atFromDate(fd.get('f_date'),'service'), notes:fd.get('f_notes')||''}); toast('Note saved'); });
  }
}

function setupSheet(bid){
  const b = bikeList().find(x=>x.id===bid); const k = cfg(b); const fr = (S.garage && S.garage.startDate) || today();
  const has = (kind,pos) => !!compOf(bid,kind,pos);
  const mtb = k.terrain==='mtb';
  const sec = [];
  if (!has('chain')) sec.push(`<fieldset><legend>Chain</legend><div class="fgrid">${dateField('s_chain','Installed',fr)}${dateField('s_wax', k.lube==='oil'?'Last lubed':'Last waxed','')}</div>
    <label class="field" for="s_lube">Method<select id="s_lube" name="s_lube">${Object.entries(LUBE).map(([v,l])=>`<option value="${v}" ${v===k.lube?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="field" for="s_chainmi">Hours on it before tracking<input id="s_chainmi" name="s_chainmi" type="number" min="0" step="0.5" value="0"></label></fieldset>`);
  if (!has('quicklink')) sec.push(`<fieldset><legend>Quick link</legend><div class="fgrid">${dateField('s_ql','Installed',fr)}<label class="field" for="s_qluses">Uses so far<input id="s_qluses" name="s_qluses" type="number" min="0" max="20" value="1"></label></div></fieldset>`);
  for (const pos of ['front','rear']) if (!has('tire',pos)) sec.push(`<fieldset><legend>${pos} tire</legend><div class="fgrid">${dateField('s_t_'+pos,'Installed',fr)}${dateField('s_s_'+pos,'Last sealant','')}</div><label class="field" for="s_tl_${pos}">Tire<input id="s_tl_${pos}" name="s_tl_${pos}" placeholder="Model and width (optional)"></label></fieldset>`);
  if (mtb && !has('fork')) sec.push(`<fieldset><legend>Suspension</legend><div class="fgrid">${dateField('s_fork','Fork last serviced',fr)}${dateField('s_shock','Shock last serviced',fr)}</div></fieldset>`);
  if (!has('pads')) sec.push(`<fieldset><legend>Brake pads</legend>${dateField('s_pads','Installed',fr)}</fieldset>`);
  if (!sec.length) return openSheet(`<h3>All set</h3><p class="muted">Everything on the ${esc(b.short)} is tracked. Edit any card to change its dates.</p><div class="foot"><button class="btn primary" data-a="close">Close</button></div>`);
  openSheet(`<div class="eyebrow" style="color:${bikeColor(b)}">${esc(b.short)}</div><h3>Quick setup</h3><p class="muted" style="margin:0;font-size:14px">Counters start on your garage start date. Change a date if you know it; leave a “last” date blank to count from install.</p><form>${sec.join('')}${foot('Start tracking')}</form>`,
    async fd => {
      const g = n => fd.get(n);
      if (g('s_lube') && g('s_lube')!==k.lube) await dref('bikes',bid).update({settings:{...(b.settings||{}), lube:g('s_lube')}});
      if (g('s_chain')){ const id = await addComp({bikeId:bid, kind:'chain', installedAt:atFromDate(g('s_chain'),'install'), priorHrs:+g('s_chainmi')||0, waxedAtInstall:true, label:''});
        if (g('s_wax') && g('s_wax') > g('s_chain')) await addEvent({bikeId:bid, componentId:id, type: (g('s_lube')||k.lube)==='oil'?'lube':'rewax', at:atFromDate(g('s_wax'),'service'), notes:'From quick setup', meta:{}}); }
      if (g('s_ql')) await addComp({bikeId:bid, kind:'quicklink', installedAt:atFromDate(g('s_ql'),'install'), priorUses:+g('s_qluses')||0});
      for (const pos of ['front','rear']) if (g('s_t_'+pos)){ const id = await addComp({bikeId:bid, kind:'tire', pos, label:g('s_tl_'+pos)||'', installedAt:atFromDate(g('s_t_'+pos),'install'), sealantAtInstall:true});
        if (g('s_s_'+pos) && g('s_s_'+pos) > g('s_t_'+pos)) await addEvent({bikeId:bid, componentId:id, type:'sealant_add', at:atFromDate(g('s_s_'+pos),'service'), notes:'From quick setup', meta:{}}); }
      if (g('s_fork')) await addComp({bikeId:bid, kind:'fork', installedAt:atFromDate(g('s_fork'),'install')});
      if (g('s_shock')) await addComp({bikeId:bid, kind:'shock', installedAt:atFromDate(g('s_shock'),'install')});
      if (g('s_pads')) await addComp({bikeId:bid, kind:'pads', installedAt:atFromDate(g('s_pads'),'install')});
      toast('Tracking started');
    });
}

function editCompSheet(cid){
  const c = S.comps.find(x=>x.id===cid); if (!c) return; const nm = c.kind==='custom' ? (c.label||'Component') : KIND[c.kind] + (c.pos?` · ${c.pos}`:'');
  openSheet(`<h3>${esc(nm)}</h3><form>
    <label class="field" for="e_label">Name or model<input id="e_label" name="e_label" value="${esc(c.label||'')}"></label>
    <div class="fgrid">${dateField('e_date','Installed', c.installedAt?.slice(0,10))}
    ${['chain','tire'].includes(c.kind) ? `<label class="field" for="e_prior">Hours before tracking<input id="e_prior" name="e_prior" type="number" min="0" step="0.5" value="${+c.priorHrs||0}"></label>`:''}
    ${c.kind==='quicklink' ? `<label class="field" for="e_uses">Uses before tracking<input id="e_uses" name="e_uses" type="number" min="0" value="${+c.priorUses||0}"></label>`:''}
    ${['pads','fork','shock','cassette','custom'].includes(c.kind) ? `<label class="field" for="e_mi">Interval (mi)<input id="e_mi" name="e_mi" type="number" min="0" value="${+c.intervalMi||''}" placeholder="default"></label><label class="field" for="e_h">Interval (hours)<input id="e_h" name="e_h" type="number" min="0" value="${+c.intervalHrs||''}" placeholder="default"></label>`:''}</div>
    ${c.kind==='chain' ? `<label class="check"><input type="checkbox" id="e_wax" name="e_wax" ${c.waxedAtInstall!==false?'checked':''}> Waxed when installed</label>`:''}
    ${c.kind==='tire' ? `<label class="field" for="e_mm">Measured width when mounted (mm)<input id="e_mm" name="e_mm" type="number" min="10" max="120" step="0.1" inputmode="decimal" value="${c.measuredMm ?? ''}" placeholder="e.g. 42.6"></label>`:''}
    ${c.kind==='tire' ? `<label class="check"><input type="checkbox" id="e_seal" name="e_seal" ${c.sealantAtInstall!==false?'checked':''}> Fresh sealant at install</label>`:''}
    <div class="foot" style="justify-content:space-between"><button type="button" class="btn danger" data-a="delc" data-cid="${esc(c.id)}">${S.confirmDel===c.id?'Tap again to delete':'Delete'}</button><span style="display:flex;gap:8px"><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn primary">Save</button></span></div></form>`,
    async fd => { const up = {label: fd.get('e_label')||'', estimated:false};
      if (fd.get('e_date')) up.installedAt = atFromDate(fd.get('e_date'),'install');
      if (fd.has('e_prior')) up.priorHrs = +fd.get('e_prior')||0; if (fd.has('e_uses')) up.priorUses = +fd.get('e_uses')||0;
      if (fd.has('e_mi')) up.intervalMi = +fd.get('e_mi')||0; if (fd.has('e_h')) up.intervalHrs = +fd.get('e_h')||0;
      if (c.kind==='chain') up.waxedAtInstall = !!fd.get('e_wax'); if (c.kind==='tire'){ up.sealantAtInstall = !!fd.get('e_seal'); up.measuredMm = fd.get('e_mm') ? +fd.get('e_mm') : null; }
      await dref('components',c.id).update(up); toast('Saved'); });
}

async function dismissNote(bid, rid){ const b = S.bikes[bid]; if (!b) return; const list = Array.from(new Set([...(b.dismissedNotes||[]), rid])).slice(-200); try { await dref('bikes',bid).update({dismissedNotes:list}); } catch(e){ toast('Could not dismiss'); } }
/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a;
  if (a==='close-scrim'){ if (ev.target === t) closeSheet(); return; }
  if (a==='close') return closeSheet();
  if (a==='sel'){ S.sel = t.dataset.bike; S.confirmDel=null; render(); return; }
  if (a==='log') return S.sel && logMenu(S.sel);
  if (a==='quick'){ if (t.dataset.ride) dismissNote(t.dataset.bike, t.dataset.ride); return quick(t.dataset.bike || S.sel, t.dataset.kind, t.dataset.cid, {todo:t.dataset.todo, pos:t.dataset.pos, label:t.dataset.label}); }
  if (a==='deltodo'){ try { await dref('todos',t.dataset.todo).delete(); toast('Removed'); } catch(e){ toast('Could not remove'); } return; }
  if (a==='plan') return planSheet(t.dataset.bike || S.sel);
  if (a==='goto'){ const el = document.getElementById('comp-'+t.dataset.cid); if (el){ el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } return; }
  if (a==='dismissnote') return dismissNote(t.dataset.bike, t.dataset.ride);
  if (a==='setup') return setupSheet(t.dataset.bike || S.sel);
  if (a==='settings') return settingsSheet(t.dataset.bike);
  if (a==='addc') return addCompSheet(t.dataset.bike);
  if (a==='editsetup') return editSetupSheet(t.dataset.bike);
  if (a==='setupadd'){ const host = $('#setupRows'); const i = Date.now(); host.insertAdjacentHTML('beforeend', S.setupRowHtml({label:'',value:'',unit:''}, i)); host.lastElementChild.querySelector('input').focus(); return; }
  if (a==='setuprm'){ t.closest('.setuprow')?.remove(); return; }
  if (a==='editc'){ S.confirmDel=null; return editCompSheet(t.dataset.cid); }
  if (a==='sync') return syncStrava(true);
  if (a==='garage') return garageSheet();
  if (a==='art') return artSheet(t.dataset.bike || S.sel, t.dataset.mode);
  if (a==='pins') return pinSheet(t.dataset.bike || S.sel);
  if (a.startsWith('wz-')) return wizAction(a, t);
  if (a==='delev'){ const id = t.dataset.eid; if (S.confirmDel!==id){ S.confirmDel=id; render(); return; } S.confirmDel=null; try { await dref('events',id).delete(); toast('Deleted'); } catch(e){ toast('Could not delete'); } return; }

async function syncStrava(manual){
  if (!S.mcp || !S.db || S.sync.state==='busy') return;
  S.sync = {state:'busy'}; renderSync();
  try {
    const gear = await fetchGear();
    const ids = new Set();
    let added = 0;
    for (const x of gear){
      const id = gearId(x); if (!id) continue;
      const prev = S.bikes[id];
      if (!prev || prev.hidden) continue; // only bikes picked in setup are tracked
      if (x.retired){ if (!prev.retired) await dref('bikes',id).update({retired:true}); continue; }
      ids.add(id);
      const rows = (S.rides[id] || []).slice(); const have = new Set(rows.map(r=>r[0]));
      const latest = rows.reduce((a,r)=> r[1]>a ? r[1] : a, '');
      let offset = 0, pages = 0, fresh = 0;
      while (pages < 30){
        const input = {bike_id:id, first:100, offset};
        if (latest) input.start_date_min = addDays(latest.slice(0,10), -2).slice(0,10) + 'T00:00:00';
        const r = await S.mcp.callTool('Strava','search_activities', input, {cache:false});
        const p = r.payload || {};
        for (const a of (p.activities || [])){
          const aid = String(a.id); if (have.has(aid)) continue; have.add(aid); fresh++;
          const s = a.summary || {};
          const row = [aid, a.start_local, +((s.distance||0)/M_PER_MI).toFixed(2), s.moving_time||0, Math.round((s.elevation_gain||0)/M_PER_FT), a.sport_type||''];
          const desc = `${a.name||''} ${a.description||''}`; if (NOTE_RX.test(desc)) row.push(desc.trim().slice(0,240));
          rows.push(row);
        }
        pages++;
        if (!p.has_next_page) break;
        offset = p.next_offset ?? (offset + 100);
      }
      const distanceMi = +((x.total_distance||0)/M_PER_MI).toFixed(2);
      const syncedAt = new Date().toISOString();
      if (!prev.syncedAt || prev.name!==x.name || Math.abs((prev.distanceMi||0)-distanceMi) > 0.01 || prev.retired || manual || fresh) await dref('bikes',id).update({name:x.name, frameType:x.frame_type||prev.frameType||'', distanceMi, retired:false, syncedAt});
      if (fresh){ rows.sort((a,b)=> a[1]<b[1]?1:-1); await dref('rides',id).set({rides:rows, updatedAt:syncedAt}); added += fresh; }
    }
    S.sync = {state:'ok', msg: added ? `Synced. ${added} new ride${added===1?'':'s'} added.` : ''};
    if (manual) toast(added ? `${added} new ride${added===1?'':'s'} from Strava` : 'Up to date with Strava');
  } catch(e){ console.warn('sync', e); S.sync = {state:'err', msg: syncErr(e)}; }
  render();
}

  return silCache[key] = c.toDataURL('image/png');
}

function keyBackground(img, tol){
  const {width:w, height:h, data:d} = img, cnt = new Map(), edge = [];

  for (let y = 0; y < h; y++) edge.push(y*w, y*w + w - 1);
  const bucket = i => ((d[i]>>4)<<8) | ((d[i+1]>>4)<<4) | (d[i+2]>>4);
  for (const p of edge){ const i = p*4; if (d[i+3] < 20) continue; const k = bucket(i); cnt.set(k, (cnt.get(k)||0) + 1); }
  const tops = [...cnt.entries()].sort((a,b) => b[1]-a[1]).slice(0,6).filter(e => e[1] >= edge.length*0.03)
    .map(([k]) => [((k>>8)&15)*16+8, ((k>>4)&15)*16+8, (k&15)*16+8]);

  for (const p of edge) if (!seen[p] && near(p*4)){ seen[p] = 1; q.push(p); }
  while (q.length){
    const p = q.pop(), x = p % w, y = (p / w) | 0; d[p*4+3] = 0;
    if (x > 0 && !seen[p-1] && near((p-1)*4)){ seen[p-1] = 1; q.push(p-1); }
    if (x < w-1 && !seen[p+1] && near((p+1)*4)){ seen[p+1] = 1; q.push(p+1); }
    if (y > 0 && !seen[p-w] && near((p-w)*4)){ seen[p-w] = 1; q.push(p-w); }
    if (y < h-1 && !seen[p+w] && near((p+w)*4)){ seen[p+w] = 1; q.push(p+w); }

}
function quantize(img, k){

  const as = new Uint8Array(px.length);

    const sum = cs.map(() => [0,0,0,0]);

      const im = new Image(); im.src = out.toDataURL('image/png'); im.alt = 'Preview of your bike art'; im.style.width = Math.min(560, out.width*scale) + 'px';
      prev.innerHTML = ''; prev.appendChild(im);
    } catch(e){ console.warn(e); if (my === st.token) prev.innerHTML = `<span class="muted">Couldn’t read that image. Try a PNG or JPEG.</span>`; }
  };
  f.addEventListener('change', e => {
    const n = e.target.name;
    if (n==='am') st.mode = e.target.value;
    if (n==='af') st.file = e.target.files && e.target.files[0] || null;
    if (n==='aw') st.width = +e.target.value;
    if (n==='ac') st.colors = +e.target.value;
    if (n==='abg') st.bg = e.target.checked;
    draw();
  });
  draw();
}

function pinSheet(bid, artIn){
  const b = fullBike(bid); if (!b) return;
  const art = artIn || artOf(b), keys = partKeys(b), spots = {};
  for (const k of keys) spots[k] = (art.spots[k] || [.5,.5]).slice();
  const pin = k => `<button type="button" class="pin" data-key="${k}" style="left:${spots[k][0]*100}%;top:${spots[k][1]*100}%" aria-label="${PART_NAMES[k]} marker. Drag it, or use the arrow keys."><span class="d"></span><span class="t">${PART_NAMES[k]}</span></button>`;
  openSheet(`<div class="eyebrow" style="color:${bikeColor(b)}">${esc(b.short)}</div><h3>Place part markers</h3>
    <p class="muted" style="margin:0;font-size:14px">Drag each dot onto its part. On the bike, the dots turn amber and red as parts come due.</p><form>
    <div class="pinframe" id="pinFrame" style="--ar:${art.ar}"><img src="${art.src}" alt="${esc(art.alt)}">${keys.map(pin).join('')}</div>
    <div><button type="button" class="btn small" id="pinReset">Reset to suggested spots</button></div>${foot('Save markers')}</form>`,
    async () => { await dref('bikes',bid).update({art:{spots}}); toast('Markers saved'); });
  const frame = $('#pinFrame');
  const place = (el, x, y) => { x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y)); spots[el.dataset.key] = [+x.toFixed(3), +y.toFixed(3)]; el.style.left = x*100 + '%'; el.style.top = y*100 + '%'; };
  frame.querySelectorAll('.pin').forEach(el => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); el.focus(); });
    el.addEventListener('pointermove', e => { if (!el.classList.contains('drag')) return; const r = frame.getBoundingClientRect(); place(el, (e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height); });
    const end = () => el.classList.remove('drag'); el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => { const dir = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key]; if (!dir) return; e.preventDefault(); const s = spots[el.dataset.key], step = e.shiftKey ? .05 : .01; place(el, s[0]+dir[0]*step, s[1]+dir[1]*step); });
  });
  $('#pinReset').addEventListener('click', () => { const def = defaultSpots(terrain(b)); frame.querySelectorAll('.pin').forEach(el => { const xy = def[el.dataset.key] || [.5,.5]; place(el, xy[0], xy[1]); }); });
}

/* ---------- garage settings ---------- */
const typeOptions = sel => TYPES.map(([v,l]) => `<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');
async function garageSheet(){
  if (!S.gear && S.mcp){ toast('Loading your bikes from Strava…'); try { await fetchGear(); } catch(e){ toast(syncErr(e)); } }
  const G = (S.garage && S.garage.defaults) || {};
  const active = (S.gear || []).filter(x => !x.retired && gearId(x));
  const rows = active.length ? active.map(x => { const id = gearId(x), b = S.bikes[id], on = !!b && !b.hidden, type = b ? terrain(b) : terrain({frameType:x.frame_type});
      return `<label class="pick"><input type="checkbox" name="gb_${esc(id)}" ${on?'checked':''}><span><div class="nm">${esc(splitName(x.name).short)}</div><div class="s">${fmtMi((x.total_distance||0)/M_PER_MI)} mi on Strava</div></span><select name="gt_${esc(id)}" aria-label="Type of ${esc(x.name)}">${typeOptions(type)}</select></label>`; }).join('')
    : `<p class="muted" style="margin:0;font-size:13px">Connect Strava to change which bikes are tracked.</p>`;
  openSheet(`<h3>Garage</h3><form>
    <fieldset><legend>Bikes</legend><div class="picks">${rows}</div><p class="muted" style="margin:0;font-size:12.5px">Unticking a bike hides it. Its log is kept if you tick it again.</p></fieldset>
    <fieldset><legend>Defaults for every bike</legend>
      <label class="field" for="gd_lube">Chain method<select id="gd_lube" name="gd_lube">${Object.entries(LUBE).map(([v,l]) => `<option value="${v}" ${v===(G.lube||'immersion')?'selected':''}>${l}</option>`).join('')}</select></label>
      <div class="fgrid"><label class="field" for="gd_rw">Rewax or relube (h)<input id="gd_rw" name="gd_rw" type="number" min="1" step="0.5" value="${+G.rewaxHrs||10}"></label>
      <label class="field" for="gd_ql">Quick link max uses<input id="gd_ql" name="gd_ql" type="number" min="1" max="10" value="${+G.qlMax||5}"></label>
      <label class="field" for="gd_sd">Sealant top-up (days)<input id="gd_sd" name="gd_sd" type="number" min="7" value="${+G.sealantDays||90}"></label></div>
      ${dateField('gd_start', 'Garage start date', S.garage && S.garage.startDate)}
      <p class="muted" style="margin:0;font-size:12.5px">A bike's own settings override these.</p></fieldset>${foot()}</form>`,
    async fd => {
      let n = Object.keys(S.bikes).length;
      for (const x of active){
        const id = gearId(x), on = !!fd.get('gb_'+id), type = fd.get('gt_'+id), b = S.bikes[id];
        if (on && !b) await dref('bikes',id).set(newBikeDoc(x, type, COLORS[n++ % COLORS.length]));
        else if (b && (on === !!b.hidden || (on && type !== terrain(b)))) await dref('bikes',id).update(on ? {hidden:false, type} : {hidden:true});
      }
      await S.root.update({defaults:{lube:fd.get('gd_lube'), rewaxHrs:+fd.get('gd_rw')||10, qlMax:+fd.get('gd_ql')||5, sealantDays:+fd.get('gd_sd')||90}, startDate: fd.get('gd_start') || (S.garage && S.garage.startDate) || today()});
      autoSynced = false; setTimeout(maybeAutoSync, 0); toast('Garage saved');
    });
}

/* ---------- onboarding ---------- */
const WZ_STEPS = ['Strava','Bikes','Start','Habits','Art'];
function newWiz(){ return {step:0, picks:{}, start: today(), fresh:'fresh', lube:'immersion', rewaxHrs:10, qlMax:5, sealantDays:90, err:'', busy:false, drawn:null}; }
function renderWizard(){
  const w = S.wiz, host = $('#wizard');
  const key = [w.step, w.err, w.busy, w.step===0 ? `${!!S.mcp}${!!S.mcpChecked}` : '', w.step===4 ? JSON.stringify(bikeList().map(b => [b.id, b.art, b.color])) : ''].join('|');
  if (w.drawn === key) return; w.drawn = key;
  const steps = `<div class="steps" aria-hidden="true">${WZ_STEPS.map((_, i) => `<i class="${i<=w.step?'on':''}"></i>`).join('')}</div><div class="eyebrow">Step ${w.step+1} of ${WZ_STEPS.length} · ${WZ_STEPS[w.step]}</div>`;
  const err = w.err ? `<p class="err" role="alert">${esc(w.err)}</p>` : '';
  const nav = (next, label='Next') => `${err}<div class="nav"><button class="btn" data-a="wz-back">Back</button><button class="btn primary" data-a="${next}" ${w.busy?'disabled':''}>${w.busy?'Saving…':label}</button></div>`;
  let h = '';
  if (w.step===0){
    const noMcp = S.mcpChecked && !S.mcp;
    h = `<h2>Set up your garage</h2><p class="lead">Workstand counts ride hours on every part from Strava, so it can tell you when to rewax, top up sealant or check your pads. Setup takes about three minutes.</p>
      <div class="panel"><b>Connect Strava</b><ol class="how">
        <li>In Claude, open <b>Settings</b>, then <b>Connectors</b>.</li>
        <li>Find <b>Strava</b>, connect it and sign in. Strava’s connector needs a Strava subscription.</li>
        <li>Come back and tap <b>Connect Strava</b>. Claude asks once whether this page may read your Strava data. It only reads; it never posts or edits.</li></ol>
        ${noMcp ? `<p class="err">Connectors aren’t available in this view. Open Workstand on claude.ai, signed in to your own account.</p>` : ''}${err}
        <div class="nav"><span class="muted" style="font-size:13px">Your garage is private to your account.</span><button class="btn primary" data-a="wz-connect" ${!S.mcp||w.busy?'disabled':''}>${w.busy?'Connecting…':'Connect Strava'}</button></div></div>`;
  } else if (w.step===1){
    const active = (S.gear || []).filter(x => !x.retired && w.picks[gearId(x)]);
    h = `<h2>Pick your bikes</h2><p class="lead">These are your active bikes on Strava. Tick the ones to track and say what kind each is. That sets sensible service intervals.</p>
      <div class="picks">${active.map(x => { const id = gearId(x), p = w.picks[id];
        return `<label class="pick"><input type="checkbox" data-wz="pick" data-id="${esc(id)}" ${p.on?'checked':''}><span><div class="nm">${esc(splitName(x.name).short)}</div><div class="s">${fmtMi((x.total_distance||0)/M_PER_MI)} mi on Strava</div></span><select data-wz="type" data-id="${esc(id)}" aria-label="Type of ${esc(x.name)}">${typeOptions(p.type)}</select></label>`; }).join('')}</div>
      <p class="muted" style="font-size:13px;margin:0">Retired bikes in Strava are left out. You can add or remove bikes later in Garage settings.</p>${nav('wz-next')}`;
  } else if (w.step===2){
    h = `<h2>When do counters start?</h2><p class="lead">Workstand counts ride hours from this date. Earlier rides don’t count toward wear.</p>
      <div class="panel"><label class="field" for="wz_start">Start date<input type="date" id="wz_start" data-wz="start" value="${esc(w.start)}" max="${today()}"></label>
      <label class="choice"><input type="radio" name="wz_fresh" data-wz="fresh" value="fresh" ${w.fresh==='fresh'?'checked':''}><span><b>Everything is fresh as of that date</b><small>Chain just waxed, sealant just topped up, pads checked. Quickest start.</small></span></label>
      <label class="choice"><input type="radio" name="wz_fresh" data-wz="fresh" value="later" ${w.fresh!=='fresh'?'checked':''}><span><b>I’ll enter each part’s dates</b><small>After setup, each bike asks when its chain, tires and pads were installed and last serviced.</small></span></label></div>${nav('wz-next')}`;
  } else if (w.step===3){
    h = `<h2>How do you look after your chain?</h2><p class="lead">These become the defaults for every bike. You can change them per bike later.</p>
      <div class="panel"><label class="field" for="wz_lube">Chain method<select id="wz_lube" data-wz="lube">${Object.entries(LUBE).map(([v,l]) => `<option value="${v}" ${v===w.lube?'selected':''}>${l}</option>`).join('')}</select></label>
      <div class="fgrid"><label class="field" for="wz_rw">Rewax or relube every (ride hours)<input type="number" id="wz_rw" data-wz="rewaxHrs" min="1" step="0.5" value="${w.rewaxHrs}"></label>
      <label class="field" for="wz_ql">Quick link max uses<input type="number" id="wz_ql" data-wz="qlMax" min="1" max="10" value="${w.qlMax}"></label>
      <label class="field" for="wz_sd">Top up sealant every (days)<input type="number" id="wz_sd" data-wz="sealantDays" min="7" value="${w.sealantDays}"></label></div>
      <p class="muted" style="font-size:13px;margin:0">Tires, pads and suspension start from typical intervals for each bike type.</p></div>${nav('wz-save', 'Save my garage')}`;
  } else {
    const list = bikeList();
    h = `<h2>Turn your bikes into pixel art</h2><p class="lead">Tap <b>Pixelize a photo</b>, pick a side-on photo of the bike, and Workstand turns it into pixel art with live status dots on its parts. You can keep the built-in bike for now and do this later from the bike's page.</p>
      <div class="picks">${list.length ? list.map(b => { const a = artOf(b);
        return `<div class="wz-art" style="--bc:${bikeColor(b)}"><img src="${a.src}" alt="${esc(a.alt)}" style="--ar:${a.ar}"><div><div class="nm">${esc(b.short)}</div><div class="muted" style="font-size:12.5px">${a.own ? 'Your art' : 'Built-in pixel bike'}</div>
          <div class="row2">${a.own ? `<button class="btn small" data-a="art" data-bike="${esc(b.id)}">Change art</button><button class="btn small" data-a="pins" data-bike="${esc(b.id)}">Place part markers</button>` : `<button class="btn primary" data-a="art" data-mode="photo" data-bike="${esc(b.id)}">Pixelize a photo</button>`}</div></div></div>`; }).join('') : `<div class="empty">Loading your bikes…</div>`}</div>
      <div class="nav"><span class="muted" style="font-size:13px">Change art any time with the Bike art button on each bike.</span><button class="btn primary" data-a="wz-finish">Open my garage</button></div>`;
  }
  host.innerHTML = steps + h;
}
function wizInput(e){
  const el = e.target.closest && e.target.closest('[data-wz]'); if (!el || !S.wiz) return;
  const w = S.wiz, f = el.dataset.wz;
  if (f==='pick') w.picks[el.dataset.id].on = el.checked;
  else if (f==='type') w.picks[el.dataset.id].type = el.value;
  else if (f==='fresh'){ if (el.checked) w.fresh = el.value; }
  else if (['rewaxHrs','qlMax','sealantDays'].includes(f)) w[f] = +el.value;
  else w[f] = el.value;
}
document.addEventListener('change', wizInput);
document.addEventListener('change', async e => {
  const id = e.target?.dataset?.setupnotes; if (!id) return;
  const b = S.bikes[id]; const v = e.target.value; if (!b || (b.setup?.notes || '') === v) return;
  try { await dref('bikes',id).update({setup:{...(b.setup||{}), notes:v, updatedAt: nowISO()}}); toast('Notes saved'); } catch(err){ toast('Could not save notes'); }
});
document.addEventListener('input', wizInput);
async function wizAction(a){
  const w = S.wiz; if (!w) return;
  if (a==='wz-connect'){
    w.busy = true; w.err = ''; renderWizard();
    try {
      const active = (await fetchGear()).filter(x => !x.retired && gearId(x));
      if (!active.length) w.err = 'Strava is connected, but it has no active bikes. Add one in Strava under My Gear, then try again.';
      else { for (const x of active){ const id = gearId(x); if (!w.picks[id]) w.picks[id] = {on:true, type: S.bikes[id] ? terrain(S.bikes[id]) : terrain({frameType:x.frame_type})}; } w.step = 1; }
    } catch(e){ console.warn(e); w.err = syncErr(e); }
    w.busy = false; renderWizard(); return;
  }
  if (a==='wz-back'){ w.err = ''; w.step = Math.max(0, w.step-1); renderWizard(); return; }
  if (a==='wz-next'){
    w.err = '';
    if (w.step===1 && !Object.values(w.picks).some(p => p.on)){ w.err = 'Pick at least one bike.'; renderWizard(); return; }
    if (w.step===2 && !/^\d{4}-\d{2}-\d{2}$/.test(w.start || '')){ w.err = 'Pick a start date.'; renderWizard(); return; }
    w.step++; renderWizard(); window.scrollTo({top:0}); return;
  }
  if (a==='wz-save') return wizSave();
  if (a==='wz-finish'){ S.wiz = null; autoSynced = false; render(); maybeAutoSync(); window.scrollTo({top:0}); }
}
async function freshParts(id, type, at){
  await addComp({bikeId:id, kind:'chain', installedAt:at, waxedAtInstall:true, priorHrs:0, label:''});
  await addComp({bikeId:id, kind:'quicklink', installedAt:at, priorUses:1});
  for (const pos of ['front','rear']) await addComp({bikeId:id, kind:'tire', pos, label:'', installedAt:at, sealantAtInstall:true});
  await addComp({bikeId:id, kind:'pads', installedAt:at});
  if (type==='mtb'){ await addComp({bikeId:id, kind:'fork', installedAt:at}); await addComp({bikeId:id, kind:'shock', installedAt:at}); }
}
async function wizSave(){
  const w = S.wiz; w.busy = true; w.err = ''; renderWizard();
  try {
    const garage = {onboarded:true, startDate:w.start, defaults:{lube:w.lube, rewaxHrs:+w.rewaxHrs||10, qlMax:+w.qlMax||5, sealantDays:+w.sealantDays||90}, updatedAt: nowISO()};
    if (S.garage) await S.root.update(garage); else await S.root.set({...garage, createdAt: nowISO()});
    let n = Object.keys(S.bikes).length;
    const at = atFromDate(w.start, 'install');
    for (const x of (S.gear || [])){
      const id = gearId(x), p = w.picks[id]; if (!p) continue;
      const prev = S.bikes[id];
      if (!p.on){ if (prev && !prev.hidden) await dref('bikes',id).update({hidden:true}); continue; }
      if (prev) await dref('bikes',id).update({hidden:false, type:p.type});
      else await dref('bikes',id).set(newBikeDoc(x, p.type, COLORS[n++ % COLORS.length]));
      if (w.fresh==='fresh' && !S.comps.some(c => c.bikeId===id && !c.retiredAt)) await freshParts(id, p.type, at);
    }
    w.step = 4;
    setTimeout(() => syncStrava(false), 0);
  } catch(e){ console.error(e); w.err = e && e.code==='quota_exceeded' ? 'Garage storage is full.' : 'Couldn’t save your garage. Try again.'; }
  w.busy = false; render();
}

async function boot(){
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user] = await Promise.all([use('db'), use('user')]);
  const uid = user ? await user.id() : null;
  if (!db || !uid){ $('#sync').innerHTML = '<span class="dot err"></span><span>Garage storage isn’t available here.</span>'; bannerMsg('Open Workstand on claude.ai, signed in to your own account, to load your garage.'); return; }
  S.db = db; S.uid = uid; S.root = db.doc('data/users/' + uid + '/garage');
  const timer = setTimeout(() => { if (!allLoaded()) bannerMsg('Your garage is taking a while to load. It will appear as soon as it connects.'); }, 10000);
  const done = (name, fromCache) => { if (!fromCache) S.loaded[name] = true; if (allLoaded()){ clearTimeout(timer); bannerMsg(''); } render(); maybeAutoSync(); };
  const fail = name => err => { console.warn(name, err); S.loaded[name] = true; bannerMsg(err.code==='revoked' ? 'Access to this garage changed. Reload to see what you can open.' : 'Part of your garage could not load. Reload the page to try again.'); render(); };
  S.root.onSnapshot(snap => { S.garage = snap.exists ? snap.data() : null; done('garage', snap.metadata.fromCache); }, fail('garage'));
  const sub = (name, fn) => col(name).onSnapshot(snap => { fn(snap); done(name, snap.metadata.fromCache); }, fail(name));
  sub('bikes', s => { S.bikes = {}; s.docs.forEach(d => S.bikes[d.id] = {id:d.id, ...d.data()}); });
  sub('rides', s => { S.rides = {}; s.docs.forEach(d => S.rides[d.id] = (d.data().rides || [])); });
  sub('components', s => { S.comps = s.docs.map(d => ({id:d.id, ...d.data()})); });
  sub('events', s => { S.events = s.docs.map(d => ({id:d.id, ...d.data()})); });
  sub('todos', s => { S.todos = s.docs.map(d => ({id:d.id, ...d.data()})).filter(t => !t.doneAt); });
  const [mcp, assets] = await Promise.all([use('mcp'), use('assets')]);
  S.mcp = mcp; S.assets = assets; S.mcpChecked = true;
  render(); maybeAutoSync();
}

render();
boot();
})();
</script>
